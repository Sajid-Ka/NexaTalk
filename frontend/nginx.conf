# nexatalk/frontend/nginx.conf (COMPLETE FIXED VERSION)

server {
  listen 80;
  server_name localhost;

  # THIS IS CRITICAL - Increase max body size for file uploads
  client_max_body_size 10M;

  root /usr/share/nginx/html;
  index index.html;

  # React SPA entry must not be cached, otherwise browsers can keep an old JS bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
  }

  # React SPA
  location / {
    try_files $uri /index.html;
  }

  # Backend API
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_cookie_path / /;
    proxy_cookie_domain backend localhost;
    
    # Increase timeouts for large file uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Increase buffer size for large requests
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # Serve uploaded avatars
  location /uploads/ {
    proxy_pass http://backend:5000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Cache avatars for better performance
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
